<!DOCTYPE html>
<html lang="en">

<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>leyboard Doge</title>
      <link rel="stylesheet" href="style.css">
      <script src="app.js" defer></script>
</head>

<body>
      <div class="game">
            <h1>KeyBoard Doge</h1>

            <div class="info">
                  <div>
                        Score:
                        <span id="score">0</span>
                  </div>

                  <div>
                        Speed:
                        <span id="speed">5</span>
                  </div>
            </div>

            <div id="gameArea">
                  <div id="player"></div>

                  <div id="gameOver">
                        Game Over
                        <p>Press Space to Restart</p>
                  </div>
            </div>
      </div>
</body>

</html>
